<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Unlisted</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unlisted">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECEEE6;
    --card: #F7F8F3;
    --ink: #1A1D26;
    --muted: #5B6070;
    --vinyl: #15161A;
    --label: #E9B72B;
    --teal: #1E6B66;
    --line: #CBCEC2;
    --danger: #A33A2B;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  button, input { font: inherit; color: inherit; }

  /* En-tête : le disque est le seul élément qui bouge */
  header {
    background: var(--vinyl);
    color: #F2F2EC;
    padding: 22px 20px 18px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .record {
    flex: none;
    width: 76px; height: 76px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at center, #15161A 0 2px, #23252D 2px 3px);
    box-shadow: 0 0 0 2px #2B2D35;
    position: relative;
    animation: spin 5s linear infinite;
  }
  .record::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 20deg, transparent 0 40deg, rgba(255,255,255,.12) 60deg, transparent 90deg 220deg, rgba(255,255,255,.10) 240deg, transparent 270deg);
  }
  .record::after {
    content: "";
    position: absolute; inset: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at center, var(--vinyl) 0 3px, var(--label) 3.5px);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .record { animation: none; } }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 2rem;
    line-height: 1;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  #compteur { margin: 0; color: #B9BCC6; font-size: .95rem; }

  nav {
    display: flex;
    background: var(--vinyl);
    padding: 0 12px;
    gap: 4px;
    position: sticky; top: 0; z-index: 5;
  }
  nav button {
    flex: 1;
    background: none;
    border: 0;
    border-bottom: 4px solid transparent;
    color: #B9BCC6;
    padding: 12px 8px 10px;
    font-weight: 600;
    cursor: pointer;
  }
  nav button[aria-selected="true"] { color: #fff; border-bottom-color: var(--label); }

  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  section[hidden] { display: none; }
  h2 { font-family: var(--display); font-size: 1.35rem; margin: 0 0 12px; }
  p.aide { color: var(--muted); margin: 0 0 16px; max-width: 60ch; }

  form { display: flex; gap: 8px; margin-bottom: 18px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  input:focus { border-color: var(--teal); outline: none; }
  .btn {
    display: inline-block;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.label { background: var(--label); color: var(--vinyl); }
  .btn.ghost { background: none; color: var(--danger); padding: 6px 0; font-weight: 500; }
  .btn.sobre { background: none; color: var(--ink); border: 2px solid var(--line); }
  .btn.small { padding: 8px 14px; }

  .statut { min-height: 1.5em; margin: 0 0 12px; color: var(--muted); }
  .statut.erreur { color: var(--danger); font-weight: 500; }

  .compte-carte {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .compte-carte p { margin: 0 0 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  progress { width: 100%; height: 10px; margin: 0 0 12px; accent-color: var(--teal); }

  .resultat {
    display: flex; gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .resultat img, .pochette-vide {
    flex: none;
    width: 76px; height: 76px;
    border-radius: 6px;
    object-fit: cover;
    background: #D9DCD0;
  }
  .infos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .titre { font-weight: 600; overflow-wrap: anywhere; }
  .detail { color: var(--muted); font-size: .92rem; }
  .infos .btn { margin-top: auto; align-self: flex-start; }
  .deja { color: var(--teal); font-weight: 600; margin-top: auto; }

  #grille {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 14px;
  }
  @media (min-width: 560px) { #grille { grid-template-columns: repeat(3, 1fr); } }
  .disque img, .disque .pochette-vide {
    width: 100%; height: auto; aspect-ratio: 1;
    border-radius: 4px;
    box-shadow: 0 6px 14px -8px rgba(0,0,0,.55);
  }
  .disque .titre { margin-top: 8px; font-size: .95rem; }

  .vide {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 28px 18px;
    text-align: center;
    color: var(--muted);
  }
  .vide p { margin: 0 0 14px; }
</style>
</head>
<body>

<header>
  <div class="record" aria-hidden="true"></div>
  <div>
    <h1>Unlisted</h1>
    <p id="compteur"></p>
  </div>
</header>

<nav role="tablist" aria-label="Sections">
  <button role="tab" id="tab-chercher" aria-selected="true" aria-controls="vue-chercher">Chercher</button>
  <button role="tab" id="tab-collection" aria-selected="false" aria-controls="vue-collection">Ma collection</button>
  <button role="tab" id="tab-compte" aria-selected="false" aria-controls="vue-compte">Compte</button>
</nav>

<main>
  <section id="vue-chercher" role="tabpanel" aria-labelledby="tab-chercher">
    <h2>Ajouter un disque</h2>
    <p class="aide">Tape le code-barres de la pochette ou le numéro de catalogue (sur la tranche ou le label), par exemple <strong>SRX 6244</strong>.</p>
    <form id="form-recherche">
      <input type="text" id="saisie" placeholder="Code-barres ou n° de catalogue" autocomplete="off" autocapitalize="characters" enterkeyhint="search" aria-label="Code-barres ou numéro de catalogue">
      <button class="btn" type="submit" id="btn-chercher">Chercher</button>
    </form>
    <p id="statut" class="statut" role="status"></p>
    <div id="resultats"></div>
  </section>

  <section id="vue-collection" role="tabpanel" aria-labelledby="tab-collection" hidden>
    <h2>Ma collection</h2>
    <div id="grille"></div>
  </section>

  <section id="vue-compte" role="tabpanel" aria-labelledby="tab-compte" hidden>
    <h2>Compte Discogs</h2>
    <p id="statut-compte" class="statut" role="status"></p>
    <div id="zone-compte"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var CLE_COLLECTION = "unlisted:collection";
  var ANCIENNE_CLE = "vinyles:collection"; // première version de l’app

  // Le stockage peut être indisponible (navigation privée) : chaque accès est protégé.
  function lire(cle, defaut) {
    try {
      var v = localStorage.getItem(cle);
      return v === null ? defaut : JSON.parse(v);
    } catch (e) { return defaut; }
  }
  function ecrire(cle, valeur) {
    try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
  }

  var collection = lire(CLE_COLLECTION, null);
  if (collection === null) collection = lire(ANCIENNE_CLE, []);
  if (!Array.isArray(collection)) collection = [];

  var utilisateur = null;       // nom d’utilisateur Discogs, ou null
  var serviceIndisponible = false;
  var enImport = false;
  var derniersResultats = [];

  var $ = function (s) { return document.querySelector(s); };

  function el(tag, props, enfants) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else n.setAttribute(k, props[k]);
    });
    (enfants || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  function pochette(url, alt) {
    if (!url) return el("div", { "class": "pochette-vide", "aria-hidden": "true" });
    return el("img", { src: url, alt: alt || "", loading: "lazy" });
  }

  function sauver() { ecrire(CLE_COLLECTION, collection); majCompteur(); }

  // --- Onglets ---
  var onglets = ["chercher", "collection", "compte"];
  function afficher(nom) {
    onglets.forEach(function (o) {
      var actif = o === nom;
      $("#tab-" + o).setAttribute("aria-selected", String(actif));
      $("#vue-" + o).hidden = !actif;
    });
    if (nom === "collection") dessinerCollection();
  }
  onglets.forEach(function (o) {
    $("#tab-" + o).addEventListener("click", function () { afficher(o); });
  });

  function majCompteur() {
    var n = collection.length;
    $("#compteur").textContent = n === 0 ? "Aucun disque pour l’instant"
      : n + (n > 1 ? " disques" : " disque") + " dans la collection";
  }

  function statut(id, message, erreur) {
    var s = $(id);
    s.textContent = message || "";
    s.className = "statut" + (erreur ? " erreur" : "");
  }

  // --- Session Discogs ---
  function chargerSession() {
    return fetch("/api/me", { credentials: "same-origin" }).then(function (res) {
      if (res.ok) return res.json().then(function (d) { utilisateur = d.username; });
      utilisateur = null;
      if (res.status === 500 || res.status === 404) serviceIndisponible = true;
    }).catch(function () {
      utilisateur = null;
      serviceIndisponible = true;
    });
  }

  function dessinerCompte() {
    var zone = $("#zone-compte");
    zone.textContent = "";

    if (serviceIndisponible) {
      statut("#statut-compte", "La connexion à Discogs n’est pas disponible pour le moment. Vérifie que le site est bien publié avec ses fonctions et ses variables d’environnement.", true);
      return;
    }

    if (!utilisateur) {
      var carte = el("div", { "class": "compte-carte" }, [
        el("p", { text: "Connecte ton compte Discogs pour chercher des disques et importer ta bibliothèque en une fois. Unlisted ne voit jamais ton mot de passe : tu t’identifies directement sur Discogs." }),
        el("a", { "class": "btn label", href: "/api/auth-start", text: "Se connecter avec Discogs" })
      ]);
      zone.appendChild(carte);
      return;
    }

    var progression = el("progress", { id: "progression", max: "100", value: "0", hidden: "" });
    var importer = el("button", { "class": "btn label", type: "button", id: "btn-import", text: "Importer ma collection Discogs" });
    importer.addEventListener("click", importerCollection);
    var quitter = el("button", { "class": "btn sobre", type: "button", text: "Se déconnecter" });
    quitter.addEventListener("click", deconnecter);

    zone.appendChild(el("div", { "class": "compte-carte" }, [
      el("p", { text: "Connecté en tant que " + utilisateur + "." }),
      el("p", { "class": "aide", text: "L’import ajoute les vinyles de ta collection Discogs à Unlisted. Les disques déjà présents ne sont pas dupliqués." }),
      progression,
      el("div", { "class": "actions" }, [importer, quitter])
    ]));
  }

  function deconnecter() {
    fetch("/api/logout", { method: "POST", credentials: "same-origin" }).then(function () {
      utilisateur = null;
      statut("#statut-compte", "Tu es déconnecté.");
      dessinerCompte();
    });
  }

  // --- Import de la collection ---
  function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function importerCollection() {
    if (enImport) return;
    enImport = true;
    var bouton = $("#btn-import");
    var barre = $("#progression");
    bouton.disabled = true;
    barre.hidden = false;
    barre.value = 0;

    var page = 1, pages = 1, ajoutes = 0, autresFormats = 0, dejaLa = 0;
    var ids = {};
    collection.forEach(function (d) { ids[d.id] = true; });

    function etape() {
      statut("#statut-compte", "Import en cours… page " + page + " sur " + pages);
      return fetch("/api/collection?page=" + page, { credentials: "same-origin" }).then(function (res) {
        if (res.status === 401) throw new Error("session");
        if (res.status === 429) throw new Error("limite");
        if (!res.ok) throw new Error("discogs");
        return res.json();
      }).then(function (d) {
        pages = d.pages || 1;
        (d.releases || []).forEach(function (r) {
          if (!r.vinyl) { autresFormats++; return; }
          if (ids[r.id]) { dejaLa++; return; }
          ids[r.id] = true;
          collection.push({
            id: r.id, title: r.title, year: r.year, country: "",
            label: r.label, catno: r.catno, thumb: r.thumb, ajouteLe: Date.now()
          });
          ajoutes++;
        });
        sauver();
        barre.value = Math.round((page / pages) * 100);
        if (page < pages) {
          page++;
          return pause(1100).then(etape); // reste sous la limite de requêtes de Discogs
        }
      });
    }

    etape().then(function () {
      var msg = ajoutes + (ajoutes > 1 ? " vinyles importés." : " vinyle importé.");
      if (dejaLa) msg += " " + dejaLa + " déjà présent" + (dejaLa > 1 ? "s" : "") + ".";
      if (autresFormats) msg += " " + autresFormats + " autre" + (autresFormats > 1 ? "s" : "") + " format" + (autresFormats > 1 ? "s" : "") + " ignoré" + (autresFormats > 1 ? "s" : "") + " (CD, cassettes…).";
      statut("#statut-compte", msg);
    }).catch(function (err) {
      var messages = {
        session: "Ta session Discogs a expiré. Reconnecte-toi pour continuer.",
        limite: "Discogs demande une pause. Les disques déjà importés sont gardés : relance l’import dans une minute.",
        discogs: "Discogs ne répond pas correctement. Relance l’import dans un instant."
      };
      if (err.message === "session") { utilisateur = null; dessinerCompte(); }
      statut("#statut-compte", messages[err.message] || "Connexion impossible. Vérifie ta connexion internet.", true);
    }).then(function () {
      enImport = false;
      var b = $("#btn-import"); if (b) b.disabled = false;
      majCompteur();
    });
  }

  // --- Recherche ---
  function dejaPossede(id) {
    return collection.some(function (d) { return d.id === id; });
  }

  function dessinerResultats() {
    var zone = $("#resultats");
    zone.textContent = "";
    derniersResultats.forEach(function (r) {
      var infos = el("div", { "class": "infos" }, [
        el("div", { "class": "titre", text: r.title }),
        el("div", { "class": "detail", text: [r.year, r.country].filter(Boolean).join(" · ") }),
        el("div", { "class": "detail", text: [r.label, r.catno].filter(Boolean).join(" · ") })
      ]);
      if (dejaPossede(r.id)) {
        infos.appendChild(el("div", { "class": "deja", text: "Dans ta collection" }));
      } else {
        var bouton = el("button", { "class": "btn small", type: "button", text: "Ajouter à ma collection" });
        bouton.addEventListener("click", function () { ajouter(r); });
        infos.appendChild(bouton);
      }
      zone.appendChild(el("div", { "class": "resultat" }, [pochette(r.thumb, ""), infos]));
    });
  }

  function ajouter(r) {
    if (dejaPossede(r.id)) return;
    collection.unshift({
      id: r.id, title: r.title, year: r.year || "", country: r.country || "",
      label: r.label || "", catno: r.catno || "", thumb: r.thumb || "", ajouteLe: Date.now()
    });
    sauver();
    dessinerResultats();
    statut("#statut", "Ajouté : " + r.title);
  }

  $("#form-recherche").addEventListener("submit", function (e) {
    e.preventDefault();
    var saisie = $("#saisie").value.trim();
    if (!saisie) { statut("#statut", "Saisis un code-barres ou un numéro de catalogue.", true); return; }
    if (!utilisateur) {
      statut("#statut", "Connecte-toi avec Discogs dans l’onglet Compte pour lancer une recherche.", true);
      return;
    }
    var bouton = $("#btn-chercher");
    bouton.disabled = true;
    statut("#statut", "Recherche en cours…");
    $("#resultats").textContent = "";

    fetch("/api/search?q=" + encodeURIComponent(saisie), { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) throw new Error("session");
      if (res.status === 429) throw new Error("limite");
      if (!res.ok) throw new Error("discogs");
      return res.json();
    }).then(function (d) {
      derniersResultats = d.results || [];
      if (derniersResultats.length === 0) {
        statut("#statut", "Aucun vinyle trouvé pour ce numéro. Vérifie les chiffres ou essaie l’autre identifiant (code-barres ou numéro de catalogue).", true);
      } else {
        statut("#statut", derniersResultats.length + (derniersResultats.length > 1 ? " pressages trouvés. Choisis le bon." : " pressage trouvé."));
      }
      dessinerResultats();
    }).catch(function (err) {
      var messages = {
        session: "Ta session Discogs a expiré. Reconnecte-toi dans l’onglet Compte.",
        limite: "Trop de recherches d’un coup. Attends une minute puis réessaie.",
        discogs: "Discogs ne répond pas correctement. Réessaie dans un instant."
      };
      if (err.message === "session") { utilisateur = null; dessinerCompte(); }
      statut("#statut", messages[err.message] || "Connexion impossible. Vérifie ta connexion internet.", true);
    }).then(function () { bouton.disabled = false; });
  });

  // --- Collection ---
  function dessinerCollection() {
    var grille = $("#grille");
    grille.textContent = "";
    if (collection.length === 0) {
      grille.style.display = "block";
      var vide = el("div", { "class": "vide" }, [
        el("p", { text: "Ta collection est vide. Importe ta bibliothèque Discogs ou cherche un disque pour ajouter le premier." })
      ]);
      var aller = el("button", { "class": "btn", type: "button", text: utilisateur ? "Chercher un disque" : "Se connecter" });
      aller.addEventListener("click", function () {
        if (utilisateur) { afficher("chercher"); $("#saisie").focus(); } else { afficher("compte"); }
      });
      vide.appendChild(aller);
      grille.appendChild(vide);
      return;
    }
    grille.style.display = "";
    collection.forEach(function (d) {
      var retirer = el("button", { "class": "btn ghost", type: "button", text: "Retirer" });
      retirer.addEventListener("click", function () {
        if (confirm("Retirer « " + d.title + " » de la collection ?")) {
          collection = collection.filter(function (x) { return x.id !== d.id; });
          sauver();
          dessinerCollection();
        }
      });
      grille.appendChild(el("div", { "class": "disque" }, [
        pochette(d.thumb, d.title),
        el("div", { "class": "titre", text: d.title }),
        el("div", { "class": "detail", text: [d.year, d.country].filter(Boolean).join(" · ") }),
        retirer
      ]));
    });
  }

  // --- Démarrage ---
  majCompteur();
  var params = new URLSearchParams(location.search);
  var retourConnexion = params.get("connecte") === "1";
  var erreurConnexion = params.get("erreur") === "connexion";
  if (retourConnexion || erreurConnexion) history.replaceState(null, "", location.pathname);

  chargerSession().then(function () {
    dessinerCompte();
    if (erreurConnexion) {
      afficher("compte");
      statut("#statut-compte", "La connexion avec Discogs a échoué. Réessaie.", true);
    } else if (retourConnexion && utilisateur) {
      afficher("compte");
      statut("#statut-compte", "Connexion réussie. Tu peux importer ta collection.");
    } else if (!utilisateur) {
      afficher(collection.length ? "collection" : "compte");
    }
  });
})();
</script>
</body>
</html>
